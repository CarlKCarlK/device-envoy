[package]
name = "device-envoy-compile-only"
version = "0.0.0"
edition = "2024"
publish = false

[features]
default = []
defmt = ["device-envoy-rp/defmt"]
embedded = ["device-envoy-rp/embedded"]
pico1 = ["device-envoy-rp/pico1", "embassy-rp/rp2040"]
pico2 = ["device-envoy-rp/pico2", "embassy-rp/rp235xb"]
arm = ["device-envoy-rp/arm", "embassy-executor/arch-cortex-m"]
riscv = ["device-envoy-rp/riscv", "embassy-executor/arch-riscv32", "riscv-rt"]
host = ["device-envoy-rp/host"]
doc-images = ["device-envoy-rp/doc-images"]
wifi = ["device-envoy-rp/wifi"]
display-trace = ["device-envoy-rp/display-trace"]

[dependencies]
device-envoy-rp = { path = "..", default-features = false }
defmt = "0.3.10"
defmt-rtt = "1.1.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
embassy-executor = { version = "0.9.1", default-features = false, features = [
    "executor-thread",
    "defmt",
] }
embassy-time = { version = "0.5.0", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
embassy-rp = { version = "0.9.0", default-features = false, features = [
    "rt",
    "defmt",
    "time-driver",
    "critical-section-impl",
] }
embedded-graphics = { version = "0.8", default-features = false }
smart-leds = "0.4.0"
paste = "1.0"
heapless = "0.8.0"
static_cell = "2.1.0"
embassy-sync = { version = "0.7.2", default-features = false }
embassy-net = { version = "0.8.0", default-features = false }
cortex-m-rt = "0.7.5"
riscv-rt = { version = "0.16", optional = true }

[[bin]]
name = "led12x4"
path = "led12x4.rs"
required-features = ["pico1"]

[[bin]]
name = "led2d_custom_mapping"
path = "led2d_custom_mapping.rs"
