<svg xmlns="http://www.w3.org/2000/svg" width="240" height="320" viewBox="0 0 240 320" role="img" aria-label="DNS test portrait background design">
  <defs>
    <style>
      .bg { fill: #075a83; }
      .panel { fill: #0a5278; }
      .panel2 { fill: #074569; }
      .line { stroke: #4f91aa; stroke-width: 1; }
      .grid { stroke: #2d7898; stroke-width: .6; opacity: .48; }
      .label { fill: #c5dce6; font-family: sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0; }
      .small { fill: #9fc4d3; font-family: sans-serif; font-size: 8px; font-weight: 700; letter-spacing: 0; }
      .value { fill: #ffffff; font-family: monospace; font-size: 20px; font-weight: 700; letter-spacing: 0; }
      .latency { fill: #ffffff; font-family: monospace; font-size: 24px; font-weight: 700; letter-spacing: 0; }
      .accent { fill: #ffc247; font-family: sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0; }
      .success { fill: #79e2a4; }
      .failure { fill: #ff756e; }
      .muted-stroke { stroke: #77aabe; stroke-width: 1; fill: none; }
      .slot-guide { fill: none; stroke: #ffc247; stroke-width: 1; stroke-dasharray: 3 2; }
      .touch-guide { fill: none; stroke: #79e2a4; stroke-width: 1; stroke-dasharray: 4 2; }
    </style>
    <pattern id="trace-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path class="grid" d="M16 0H0V16"/>
    </pattern>
  </defs>

  <rect class="bg" width="240" height="320"/>
  <rect width="240" height="320" fill="url(#trace-grid)"/>
  <path class="muted-stroke" opacity=".28" d="M18 78h24v-32h42M182 58h24v42h20M40 232h44v22h62M136 34h18v26h36"/>

  <rect class="panel" x="10" y="10" width="220" height="258" rx="7"/>
  <line class="line" x1="20" y1="42" x2="220" y2="42"/>
  <line class="line" x1="20" y1="246" x2="220" y2="246"/>

  <text class="label" x="22" y="28">DNS TEST</text>
  <circle class="success" cx="174" cy="24" r="4"/>
  <text class="label" x="185" y="28">READY</text>

  <text class="small" x="22" y="62">TARGET</text>
  <text class="small" x="195" y="62" text-anchor="middle">STATUS</text>
  <rect class="panel2" x="20" y="96" width="200" height="80" rx="5"/>

  <text class="small" x="120" y="162" text-anchor="middle">LAST LOOKUP</text>
  <text class="small" x="28" y="200">QUERIES</text>
  <text class="small" x="28" y="222">SUCCESS</text>
  <text class="small" x="28" y="240">FAILED</text>

  <!-- Remove this entire group before exporting the static background bitmap. -->
  <g id="preview-values" data-remove-before-export="true">
    <!-- STATUS: dynamic lookup state; firmware box=(170,68,50,20), centered. -->
    <text id="placeholder-status" class="value success" x="195" y="86" text-anchor="middle" data-purpose="Lookup status" data-screen-x="170" data-screen-y="68" data-width="50" data-height="20" data-color-success="#79e2a4" data-color-failure="#ff756e" data-font="FONT_10X20" data-align="center">TAP</text>
    <!-- TARGET: DNS name; firmware origin=(22,68), bounds=130x20, color=#ffffff, font=FONT_10X20, left aligned. -->
    <text id="placeholder-target" class="value" x="22" y="86" data-purpose="DNS target" data-screen-x="22" data-screen-y="68" data-width="130" data-height="20" data-color="#ffffff" data-font="FONT_10X20" data-align="left">example.com</text>
    <!-- LATENCY: latest lookup time; firmware box=(60,119,120,24), color=#ffffff, font=PROFONT_24_POINT, centered. -->
    <text id="placeholder-latency" class="latency" x="120" y="142" text-anchor="middle" data-purpose="Latest latency" data-screen-x="60" data-screen-y="119" data-width="120" data-height="24" data-color="#ffffff" data-font="PROFONT_24_POINT" data-align="center">22 ms</text>
    <!-- COUNTERS: right-aligned at x=210; top positions 180, 202, 220; FONT_10X20. -->
    <g id="preview-values-stats">
      <text id="placeholder-queries" class="value" x="210" y="198" text-anchor="end" data-purpose="Query count" data-screen-x="160" data-screen-y="180" data-width="50" data-height="20" data-color="#ffffff" data-font="FONT_10X20" data-align="right">1</text>
      <text id="placeholder-success" class="value success" x="210" y="220" text-anchor="end" data-purpose="Success count" data-screen-x="160" data-screen-y="202" data-width="50" data-height="20" data-color="#79e2a4" data-font="FONT_10X20" data-align="right">1</text>
      <text id="placeholder-failed" class="value failure" x="210" y="238" text-anchor="end" data-purpose="Failure count" data-screen-x="160" data-screen-y="220" data-width="50" data-height="20" data-color="#ff756e" data-font="FONT_10X20" data-align="right">0</text>
    </g>
  </g>

  <rect class="panel2" x="10" y="276" width="220" height="36" rx="6"/>
  <text class="small" x="18" y="272">SETTINGS</text>
  <line class="line" x1="83" y1="280" x2="83" y2="308"/>
  <line class="line" x1="157" y1="280" x2="157" y2="308"/>

  <g transform="translate(47 285)">
    <circle cx="0" cy="2" r="5" class="muted-stroke"/>
    <path d="M-3 2h6M0-1v6" stroke="#ffc247" stroke-width="1.4"/>
    <text class="accent" x="0" y="21" text-anchor="middle">CAL</text>
  </g>
  <g transform="translate(111 281)">
    <path d="M0 8c4-4 15-4 19 0" class="muted-stroke"/>
    <path d="M5 4c3-2 6-2 9 0" class="muted-stroke"/>
    <circle cx="9.5" cy="11" r="2" fill="#ffc247"/>
    <text class="accent" x="9.5" y="25" text-anchor="middle">WI-FI</text>
  </g>
  <g transform="translate(185 283)">
    <path d="M1 5a8 8 0 0 1 14-5" class="muted-stroke"/>
    <path d="M15 0v6h-6" stroke="#ffc247" stroke-width="1.4" fill="none"/>
    <text class="accent" x="8" y="23" text-anchor="middle">ROTATE</text>
  </g>

  <!-- Hidden developer overlay. Change display to inline to see exact dynamic slots and touch hitboxes. -->
  <g id="developer-guides" display="none" data-remove-before-export="true">
    <g id="dynamic-slot-guides">
      <rect id="slot-target" class="slot-guide" x="22" y="68" width="130" height="20" data-purpose="DNS target" data-font="FONT_10X20" data-color="#ffffff"/>
      <rect id="slot-status" class="slot-guide" x="170" y="68" width="50" height="20" data-purpose="Lookup status" data-font="FONT_10X20"/>
      <rect id="slot-latency" class="slot-guide" x="60" y="119" width="120" height="24" data-purpose="Latest latency" data-font="PROFONT_24_POINT" data-color="#ffffff"/>
      <rect id="slot-queries" class="slot-guide" x="160" y="180" width="50" height="20" data-purpose="Query count" data-font="FONT_10X20"/>
      <rect id="slot-success" class="slot-guide" x="160" y="202" width="50" height="20" data-purpose="Success count" data-font="FONT_10X20"/>
      <rect id="slot-failed" class="slot-guide" x="160" y="220" width="50" height="20" data-purpose="Failure count" data-font="FONT_10X20"/>
    </g>
    <!-- TOUCH: CAL=(10,276,73,36), WI-FI=(83,276,74,36), ROTATE=(157,276,73,36), all in screen coordinates. -->
    <g id="touch-region-guides">
      <rect id="touch-cal" class="touch-guide" x="10" y="276" width="73" height="36" data-purpose="Calibration button"/>
      <rect id="touch-wifi" class="touch-guide" x="83" y="276" width="74" height="36" data-purpose="Wi-Fi button"/>
      <rect id="touch-rotate" class="touch-guide" x="157" y="276" width="73" height="36" data-purpose="Rotate button"/>
    </g>
  </g>
</svg>
