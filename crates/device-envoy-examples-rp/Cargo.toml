[package]
edition = "2024"
rust-version = "1.93"
# if this changes, update .vscode/launch.json and .cargo/config.toml
name = "device-envoy-examples-rp"
version = "0.1.0"
description = "Pico application launchers for Device Envoy examples"
keywords = ["embedded", "rp2040", "rp235x", "ws2812", "i2s"]
categories = ["embedded", "asynchronous", "no-std", "hardware-support"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/CarlKCarlK/device-envoy"
documentation = "https://docs.rs/device-envoy-examples-rp"
homepage = "https://github.com/CarlKCarlK/device-envoy"
exclude = ["demos/**", "tests-compile-only/**"]

autolib = false
build = "build.rs"

[package.metadata.docs.rs]
all-features = false
no-default-features = true
default-target = "thumbv6m-none-eabi"
targets = ["thumbv6m-none-eabi", "thumbv8m.main-none-eabihf"]
features = ["embedded", "wifi", "doc-images"]

[package.metadata.envoy]
# Envoy package marker
rename-from = "device-kit" # Historical: renamed from device-kit to device-envoy

[features]
default = ["host"]
defmt = ["dep:defmt-rtt", "dep:panic-probe", "device-envoy-rp/defmt"]
embedded = ["defmt", "pico1", "arm", "device-envoy-rp/embedded"]
embedded-pico2 = [
    "defmt",
    "pico2",
    "arm",
    "device-envoy-rp/embedded-pico2",
]
pico1 = ["dep:embassy-rp", "embassy-rp/rp2040", "defmt", "device-envoy-rp/pico1"]
pico2 = ["dep:embassy-rp", "embassy-rp/rp235xb", "defmt", "device-envoy-rp/pico2"]
arm = [
    "dep:cortex-m",
    "dep:cortex-m-rt",
    "embassy-executor/platform-cortex-m",
    "dep:embassy-hal-internal",
    "embassy-hal-internal/cortex-m",
    "embassy-hal-internal/prio-bits-2",
    "critical-section/restore-state-u8",
]
host = [
    "dep:png",
    "dep:tempfile",
    "critical-section/std",
    "device-envoy-core/host",
] # For testing on host platform without hardware dependencies
doc-images = ["dep:embed-doc-image"]
wifi = ["dep:cyw43", "dep:cyw43-pio", "dep:cyw43-firmware", "dep:embassy-net", "device-envoy-core/wifi", "device-envoy-rp/wifi"]
display-trace = []

[dependencies]
device-envoy-rp = { path = "../device-envoy-rp", default-features = false }
defmt = "1.0.1"
defmt-rtt = { version = "1.1.0", optional = true }
panic-probe = { version = "1.0.0", features = ["print-defmt"], optional = true }

embassy-executor = { version = "0.10.0", default-features = false, features = [
    "executor-thread",
    "defmt",
] }
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"
embassy-time = { version = "0.5.1", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
derive_more = { version = "2.1.1", default-features = false, features = [
    "debug",
    "display",
    "error",
    "from",
] }
# num-bigint = { version = "0.4.6", default-features = false }
heapless = { version = "0.9.2", features = ["serde"] }
time = { version = "0.3", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
smart-leds = "0.4.0"
device-envoy-core = { version = "0.1.4-alpha.1", path = "../device-envoy-core", features = ["defmt"] }
device-envoy-examples-core = { version = "0.0.0", path = "../device-envoy-examples-core" }
itertools = { version = "0.14.0", default-features = false }
critical-section = { version = "1.2.0", default-features = false }
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-io-async = "0.7.0"
embedded-hal-bus = { version = "0.3.0", features = [
    "async",
    "portable-atomic",
] }
portable-atomic = { version = "1.13.1", features = ["critical-section"] }
hd44780-driver = "0.4.0"
esp-hal-mfrc522 = "0.3.3"
static_cell = "2.1.1"
paste = "1.0"
embedded-graphics = { version = "0.8", default-features = false }
embed-doc-image = { version = "0.1.4", optional = true }
png = { version = "0.18", optional = true }
tempfile = { version = "3.27", optional = true }
pio = "0.3"
fixed = "1.31"
# Pinned below the latest 0.10.0: that version's embedded-graphics-core ^0.4.1
# requires az ~1.2.0, which conflicts with `fixed`'s az ^1.3 requirement in
# this same workspace lockfile. 0.9.0 depends on embedded-graphics-core ^0.4.0
# (az ^1.1, compatible) and has an identical API for the Builder/SpiInterface/
# ILI9341Rgb565 surface CydRp uses.
mipidsi = "=0.9.0"

[target.'cfg(target_os = "none")'.dependencies]
embassy-embedded-hal = { version = "0.6.0", default-features = false }
embassy-rp = { version = "0.10.0", default-features = false, features = [
    "rt",
    "defmt",
    "time-driver",
    "critical-section-impl",
], optional = true }
embassy-hal-internal = { version = "0.5.0", default-features = false, optional = true }
cyw43 = { version = "0.7.0", features = [
    "defmt",
    "firmware-logs",
], optional = true }
cyw43-pio = { version = "0.10.0", features = ["defmt"], optional = true }
cyw43-firmware = { version = "0.1", features = ["wifi"], optional = true }
embassy-net = { version = "0.9.1", features = [
    "defmt",
    "tcp",
    "udp",
    "dhcpv4",
    "dns",
    "medium-ethernet",
], optional = true }

[target.'cfg(all(target_os = "none", target_arch = "arm"))'.dependencies]
# ARM Cortex-M dependencies (for Pico 1 and Pico 2 ARM core)
cortex-m-rt = { version = "0.7.5", optional = true }
cortex-m = { version = "0.7.7", optional = true }

[dev-dependencies]

[lints.rust]
# To use the `unsafe` keyword, do not remove the `unsafe_code = "forbid"` entry.
# Instead, prefer to change it to `unsafe_code = "deny"` + opt-in with local use of
# `#[expect(unsafe_code)]`'s on an as needed basis.
bare_trait_objects = "forbid"
rust_2018_idioms = { level = "warn", priority = -2 }
unfulfilled_lint_expectations = "deny"
unknown_lints = "warn"
unsafe_code = "deny"
unused_variables = "warn"
non_snake_case = "warn"
non_camel_case_types = "warn"
non_upper_case_globals = "warn"
unexpected_cfgs = { level = "deny", check-cfg = [
    'cfg(target_pointer_width, values("128"))',
] }
missing_docs = "warn"
warnings = "deny"

[lints.clippy]
# Safety-critical application lints
arithmetic_side_effects = "deny"
float_cmp_const = "deny"
indexing_slicing = "deny"
pedantic = { level = "deny", priority = -2 }
semicolon_if_nothing_returned = "warn"
semicolon_inside_block = "warn"
str_to_string = "warn"
unwrap_used = "deny"
wildcard_imports = "deny"

all = { level = "warn", priority = -2 }
nursery = { level = "warn", priority = -2 }
# End of safety-critical application lints

allow_attributes = "warn"
allow_attributes_without_reason = "deny"
cargo_common_metadata = { level = "warn", priority = -1 }
doc_markdown = "warn"
enum_glob_use = "forbid"
enum_variant_names = "warn"
equatable_if_let = "warn"
error_impl_error = "allow"
implicit_return = "allow"
integer_division_remainder_used = "warn"
items-after-statements = "warn"
iter_nth_zero = "warn"
match_bool = "warn"
match-same-arms = "warn"
min_ident_chars = "warn"
missing_docs_in_private_items = { level = "allow", priority = -1 }
missing_errors_doc = "warn"
missing_trait_methods = "warn"
module_name_repetitions = "warn"
multiple_crate_versions = "allow"
obfuscated_if_else = "warn"
pub_use = "allow"
pub_with_shorthand = "warn"
question_mark_used = "allow"
self_named_module_files = "warn"
semicolon_outside_block = "warn"
separated_literal_suffix = "warn"
shadow_reuse = "warn"
shadow_unrelated = "warn"
similar_names = "warn"
single_call_fn = "allow"
std_instead_of_alloc = "warn"
std_instead_of_core = "warn"
too_long_first_doc_paragraph = "warn"
unnecessary_wraps = "warn"
unreachable = "warn"
must_use_candidate = "warn"
blanket_clippy_restriction_lints = "warn"
cargo = "warn"
restriction = "warn"
