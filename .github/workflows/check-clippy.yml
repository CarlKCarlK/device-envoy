name: Check Clippy

"on":
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-clippy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clippy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Device Envoy
        uses: actions/checkout@v4

      - name: Install Rust 1.98.0 with Clippy
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy

      # The clippy runs are defined once, in `check_clippy` in `xtask/src/main.rs`, which
      # `cargo check-all` also runs.
      - name: Clippy
        run: cargo run --manifest-path xtask/Cargo.toml -- check-clippy
