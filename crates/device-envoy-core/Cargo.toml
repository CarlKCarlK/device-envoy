[package]
name = "device-envoy-core"
version = "0.0.5-alpha.3"
edition = "2024"
description = "Shared traits and data types for device-envoy platform crates"
keywords = ["embedded", "no-std", "embassy", "ws2812", "device-abstraction"]
categories = ["embedded", "asynchronous", "no-std", "hardware-support"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/CarlKCarlK/device-envoy"
documentation = "https://docs.rs/device-envoy-core"
homepage = "https://github.com/CarlKCarlK/device-envoy"

[lib]
name = "device_envoy_core"
path = "src/lib.rs"

[features]
host = ["dep:png"]
defmt = ["dep:defmt"]
wifi = []
doc-images = ["dep:embed-doc-image"]

[dependencies]
smart-leds = "0.4.0"
embedded-graphics = { version = "0.8", default-features = false }
embassy-executor = { version = "0.9.0", default-features = false }
embassy-futures = "0.1.2"
embassy-sync = "0.7.2"
embassy-time = { version = "0.5.0" }
embassy-net = { version = "0.8.0", features = ["dns", "udp", "proto-ipv4", "medium-ip"] }
heapless = { version = "0.8.0", features = ["serde"] }
paste = { version = "1.0" }
serde = { version = "1.0", default-features = false, features = ["derive"] }
postcard = { version = "1.0", default-features = false }
crc32fast = { version = "1.4.0", default-features = false }
critical-section = { version = "1.2.0", default-features = false }
defmt = { version = "0.3", optional = true }
png = { version = "0.17", optional = true }
portable-atomic = { version = "1.11.1", features = ["critical-section"] }
static_cell = "2.1.0"
time = { version = "0.3", default-features = false }
embed-doc-image = { version = "0.1.4", optional = true }

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }

[[test]]
name = "led2d_text_render"
path = "tests/led2d_text_render.rs"
required-features = ["host"]

[[test]]
name = "pngs"
path = "tests/pngs.rs"
required-features = ["host"]
