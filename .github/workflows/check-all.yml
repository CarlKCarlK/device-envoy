name: Check All

"on":
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

concurrency:
  group: check-all-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-main:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi,thumbv8m.main-none-eabihf,riscv32imac-unknown-none-elf

      - name: Install ESP toolchain
        shell: bash
        run: |
          cargo install espup --locked
          espup install \
            --targets esp32c6,esp32s3 \
            --export-file "$HOME/export-esp.sh"

      - name: Run workspace check-all
        run: cargo check-all

  check-rp-blinky:
    runs-on: ubuntu-latest
    needs: check-main

    steps:
      - name: Checkout device-envoy
        uses: actions/checkout@v4
        with:
          path: device-envoy

      - name: Clone device-envoy-rp-blinky
        run: git clone --depth 1 https://github.com/CarlKCarlK/device-envoy-rp-blinky.git device-envoy-rp-blinky

      - name: Patch to local device-envoy checkout
        shell: bash
        run: |
          cat <<'EOF' >> device-envoy-rp-blinky/Cargo.toml

          [patch.crates-io]
          device-envoy-rp = { path = "../device-envoy/crates/device-envoy-rp" }
          EOF

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi,thumbv8m.main-none-eabihf

      - name: Check on Pico 1 and Pico 2
        shell: bash
        run: |
          cd device-envoy-rp-blinky
          ./scripts/device-action.sh check 1
          ./scripts/device-action.sh check 2

  check-esp-blinky:
    runs-on: ubuntu-latest
    needs: check-main

    steps:
      - name: Checkout device-envoy
        uses: actions/checkout@v4
        with:
          path: device-envoy

      - name: Clone device-envoy-esp-blinky
        run: git clone --depth 1 https://github.com/CarlKCarlK/device-envoy-esp-blinky.git device-envoy-esp-blinky

      - name: Patch to local device-envoy checkout
        shell: bash
        run: |
          cat <<'EOF' >> device-envoy-esp-blinky/Cargo.toml

          [patch.crates-io]
          device-envoy-esp = { path = "../device-envoy/crates/device-envoy-esp" }
          EOF

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imac-unknown-none-elf

      - name: Install ESP toolchain
        shell: bash
        run: |
          cargo install espup --locked
          espup install \
            --targets esp32c6,esp32s3 \
            --export-file "$HOME/export-esp.sh"

      - name: Check on ESP32-C6 and ESP32-S3
        shell: bash
        run: |
          cd device-envoy-esp-blinky
          source "$HOME/export-esp.sh"
          ./scripts/device-action.sh check c6
          ./scripts/device-action.sh check s3
