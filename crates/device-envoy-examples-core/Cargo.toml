[package]
name = "device-envoy-examples-core"
version = "0.0.0"
edition = "2024"
publish = false
build = "build.rs"

[features]
host = ["device-envoy-core/host"]
wasm = ["device-envoy-core/wasm"]

[dependencies]
device-envoy-core = { path = "../device-envoy-core" }
smart-leds = "0.4.0"
embedded-graphics = { version = "0.8", default-features = false }
heapless = "0.9.2"
profont = "0.7"

[build-dependencies]

[[test]]
name = "dns_tester_memory"
path = "tests/dns_tester_memory.rs"
required-features = ["host"]

[dev-dependencies]
futures-executor = "0.3"
