[alias]
publish-core-dry-run = "publish --package device-envoy-core --dry-run"
publish-core = "publish --package device-envoy-core"
publish-rp-dry-run = "publish --package device-envoy-rp --dry-run --no-verify"
publish-rp = "publish --package device-envoy-rp --no-verify"
publish-esp-dry-run = "publish --package device-envoy-esp --dry-run --no-verify"
publish-esp = "publish --package device-envoy-esp --no-verify"
publish-device-envoy-dry-run = "publish --package device-envoy --dry-run"
