<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Device Envoy Conway</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #101418;
        color: #e7f0f7;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      main {
        width: min(920px, 92vw);
        display: grid;
        gap: 1rem;
      }

      img {
        width: min(640px, 92vw);
        image-rendering: auto;
        background: #050608;
        border: 1px solid #2c3a42;
        border-radius: 16px;
      }

      button {
        margin: 0.15rem;
        padding: 0.55rem 0.75rem;
        border: 1px solid #45606c;
        border-radius: 999px;
        background: #17232a;
        color: #e7f0f7;
      }

      kbd {
        padding: 0.1rem 0.35rem;
        border-radius: 0.35rem;
        background: #22313a;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Conway on a virtual LED panel</h1>
      <img id="panel" alt="Conway LED panel rendered as PNG" />
      <section>
        <button data-key="play_pause">Play/Pause</button>
        <button data-key="next">Next</button>
        <button data-key="prev">Previous Search</button>
        <button data-key="cancel">Cancel Search</button>
      </section>
      <section>
        <button data-key="0">0</button>
        <button data-key="1">1</button>
        <button data-key="2">2</button>
        <button data-key="3">3</button>
        <button data-key="4">4</button>
        <button data-key="5">5</button>
        <button data-key="6">6</button>
        <button data-key="7">7</button>
        <button data-key="8">8</button>
        <button data-key="9">9</button>
      </section>
      <p>
        Keys match the hardware demo: <kbd>Space</kbd> play/pause,
        <kbd>N</kbd> next, <kbd>P</kbd> predecessor search, <kbd>Esc</kbd>
        cancel, and <kbd>0</kbd>-<kbd>9</kbd> select patterns.
      </p>
      <p id="status">loading</p>
    </main>
    <script type="importmap">
      {
        "imports": {
          "env": "./env.js"
        }
      }
    </script>
    <script type="module" src="./main.js?v=3"></script>
  </body>
</html>
