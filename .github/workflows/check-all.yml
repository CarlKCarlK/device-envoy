name: Check All

"on":
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

concurrency:
  group: check-all-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-msrv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@1.93

      - name: Check workspace MSRV
        run: |
          cargo check -p device-envoy-core --no-default-features
          cargo check -p device-envoy --no-default-features

  check-main:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi,thumbv8m.main-none-eabihf,riscv32imac-unknown-none-elf

      - name: Install ESP toolchain
        shell: bash
        run: |
          cargo install espup --locked
          espup install \
            --targets esp32c6,esp32s3 \
            --export-file "$HOME/export-esp.sh"

      - name: Run workspace check-all
        run: cargo check-all
