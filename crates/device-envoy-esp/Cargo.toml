[package]
name = "device-envoy-esp"
version = "0.1.1"
edition = "2024"
rust-version = "1.93"
description = "Build ESP32 applications with composable device abstractions"
keywords = ["embedded", "esp32", "esp32c6", "esp32s3", "ws2812"]
categories = ["embedded", "asynchronous", "no-std", "hardware-support"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/CarlKCarlK/device-envoy"
documentation = "https://docs.rs/device-envoy-esp"
homepage = "https://github.com/CarlKCarlK/device-envoy"

[package.metadata.docs.rs]
all-features = false
no-default-features = true
default-target = "riscv32imac-unknown-none-elf"
targets = ["riscv32imac-unknown-none-elf"]
features = ["doc-images", "esp32c6"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
host = []
compile-fail-tests = []
doc-images = ["dep:embed-doc-image"]
esp32 = [
    "esp-hal/esp32",
    "esp-hal/rt",
    "esp-hal/unstable",
    "esp-rtos/esp32",
    "esp-storage/esp32",
    "esp-alloc/esp32",
    "esp-radio/esp32",
    "esp-radio/wifi",
    "esp-backtrace/esp32",
    "esp-println/esp32",
    "esp-bootloader-esp-idf/esp32",
]
esp32c2 = [
    "esp-hal/esp32c2",
    "esp-rtos/esp32c2",
    "esp-storage/esp32c2",
    "esp-alloc/esp32c2",
    "esp-radio/esp32c2",
    "esp-radio/wifi",
    "esp-backtrace/esp32c2",
    "esp-println/esp32c2",
    "esp-bootloader-esp-idf/esp32c2",
]
esp32c3 = [
    "esp-hal/esp32c3",
    "esp-rtos/esp32c3",
    "esp-storage/esp32c3",
    "esp-alloc/esp32c3",
    "esp-radio/esp32c3",
    "esp-radio/wifi",
    "esp-backtrace/esp32c3",
    "esp-println/esp32c3",
    "esp-bootloader-esp-idf/esp32c3",
]
esp32c5 = [
    "esp-hal/esp32c5",
    "esp-rtos/esp32c5",
    "esp-storage/esp32c5",
    "esp-alloc/esp32c5",
    "esp-radio/esp32c5",
    "esp-radio/wifi",
    "esp-backtrace/esp32c5",
    "esp-println/esp32c5",
    "esp-bootloader-esp-idf/esp32c5",
]
esp32c6 = [
    "esp-hal/esp32c6",
    "esp-rtos/esp32c6",
    "esp-storage/esp32c6",
    "esp-alloc/esp32c6",
    "esp-radio/esp32c6",
    "esp-radio/wifi",
    "esp-backtrace/esp32c6",
    "esp-println/esp32c6",
    "esp-bootloader-esp-idf/esp32c6",
]
esp32c61 = [
    "esp-hal/esp32c61",
    "esp-rtos/esp32c61",
    "esp-storage/esp32c61",
    "esp-alloc/esp32c61",
    "esp-radio/esp32c61",
    "esp-radio/wifi",
    "esp-backtrace/esp32c61",
    "esp-println/esp32c61",
    "esp-bootloader-esp-idf/esp32c61",
]
esp32h2 = [
    "esp-hal/esp32h2",
    "esp-rtos/esp32h2",
    "esp-storage/esp32h2",
    "esp-alloc/esp32h2",
    "esp-radio/esp32h2",
    "esp-backtrace/esp32h2",
    "esp-println/esp32h2",
    "esp-bootloader-esp-idf/esp32h2",
]
esp32s2 = [
    "esp-hal/esp32s2",
    "esp-rtos/esp32s2",
    "esp-storage/esp32s2",
    "esp-alloc/esp32s2",
    "esp-radio/esp32s2",
    "esp-radio/wifi",
    "esp-backtrace/esp32s2",
    "esp-println/esp32s2",
    "esp-bootloader-esp-idf/esp32s2",
]
esp32s3 = [
    "esp-hal/esp32s3",
    "esp-rtos/esp32s3",
    "esp-storage/esp32s3",
    "esp-alloc/esp32s3",
    "esp-radio/esp32s3",
    "esp-radio/wifi",
    "esp-backtrace/esp32s3",
    "esp-println/esp32s3",
    "esp-bootloader-esp-idf/esp32s3",
]

[dependencies]
embassy-executor = { version = "0.10.0" }
embassy-time   = { version = "0.5.1" }
embassy-sync   = { version = "0.8.0" }
embassy-embedded-hal = { version = "0.6.0", default-features = false }
embassy-futures = { version = "0.1.2" }
smart-leds     = { version = "0.4.0" }
device-envoy-core = { version = "0.1.1", path = "../device-envoy-core", features = ["wifi"] }
embedded-graphics = { version = "0.8", default-features = false }
heapless       = { version = "0.9.2", features = ["serde"] }
static_cell    = { version = "2.1.1" }
paste          = { version = "1.0" }
embed-doc-image = { version = "0.1.4", optional = true }
embedded-storage = "0.3.1"
serde = { version = "1.0", default-features = false, features = ["derive"] }
time = { version = "0.3", default-features = false }
portable-atomic = { version = "1.13.1" }
derive_more = { version = "2.1.1", default-features = false, features = ["from"] }

[target.'cfg(target_os = "none")'.dependencies]
esp-hal = { version = "1.1.0", default-features = false, features = ["unstable"] }
esp-rtos = { version = "0.3.0", default-features = false, features = ["embassy", "esp-radio", "esp-alloc"] }
esp-storage = { version = "0.9.0", default-features = false }
esp-alloc = { version = "0.10.0", default-features = false, features = ["compat", "global-allocator"] }
esp-radio = { version = "0.18.0", default-features = false, features = ["esp-alloc", "log-04", "unstable"] }
embassy-net = { version = "0.9.1", features = ["dhcpv4", "dns", "proto-ipv4", "udp", "tcp"] }
log = { version = "0.4", default-features = false }
embedded-hal = "1.0"
embedded-hal-bus = { version = "0.3.0", features = ["async"] }
esp-hal-mfrc522 = "0.3.3"
mipidsi = "=0.9.0"

[dev-dependencies]

[target.'cfg(not(target_os = "none"))'.dev-dependencies]
png = { version = "0.18" }
trybuild = { version = "1.0" }

[target.'cfg(target_os = "none")'.dev-dependencies]
esp-backtrace = { version = "0.19.0", default-features = false, features = [
    "panic-handler",
    "halt-cores",
    "println",
] }
esp-println = { version = "0.17.0", default-features = false, features = ["uart", "log-04"] }
log = { version = "0.4", default-features = false }
esp-bootloader-esp-idf = { version = "0.5.0", default-features = false }


